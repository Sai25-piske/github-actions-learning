name: My First GitHub Action

on:
  push:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo "Hello Sai! I am learning GitHub Actions"

      - name: Check operating system
        run: uname -a

      - name: Check Linux user
